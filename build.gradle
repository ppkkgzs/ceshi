// 根构建脚本：统一 Android Gradle 插件与依赖版本
plugins {
    id 'com.android.application' version '8.5.2' apply false
    id 'com.android.library' version '8.5.2' apply false
}

ext {
    // 应用与 SDK 版本（Android 5.0 / API 21 起）
    minSdkVersion = 21
    targetSdkVersion = 34
    compileSdkVersion = 34

    versionName = "1.8.0.2-beta"
    versionCode = 19

    // release 签名：仅当本地存在 keystore.properties 时启用，避免克隆仓库缺密钥导致构建失败
    hasReleaseSigning = false
    def kep = new File(rootProject.projectDir, "keystore.properties")
    if (kep.exists()) {
        def props = new Properties()
        kep.withInputStream { props.load(it) }
        if (props.storeFile) {
            ext.hasReleaseSigning = true
            ext.releaseStoreFile = props.storeFile
            ext.releaseStorePassword = props.storePassword
            ext.releaseKeyAlias = props.keyAlias
            ext.releaseKeyPassword = props.keyPassword
        }
    }

    // 依赖版本集中管理
    appcompatVersion = "1.7.0"
    materialVersion = "1.12.0"
    constraintLayoutVersion = "2.1.4"
    recyclerviewVersion = "1.3.2"
    roomVersion = "2.6.1"
    lifecycleVersion = "2.7.0"
    okioVersion = "3.9.0"
    apacheCommonsCompress = "1.26.2"

    // Shizuku：以 adb/shell 权限访问 Android/data、Android/obb 等受限目录（无需 Root）
    shizukuVersion = "13.1.5"
}

// 所有 Android 模块：release 不再被 lint Vital 阻断，保证可产出发布包
subprojects {
    afterEvaluate { p ->
        if (p.plugins.hasPlugin('com.android.application') ||
                p.plugins.hasPlugin('com.android.library')) {
            p.android {
                lint {
                    abortOnError false
                    checkReleaseBuilds false
                }
            }
        }
    }
}