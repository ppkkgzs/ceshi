// app 模块构建配置 —— 主应用壳
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alltoolbox.app'
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "beta.alltoolboxbeta.pk.beta"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (rootProject.ext.hasReleaseSigning) {
                storeFile rootProject.file(rootProject.ext.releaseStoreFile)
                storePassword rootProject.ext.releaseStorePassword
                keyAlias rootProject.ext.releaseKeyAlias
                keyPassword rootProject.ext.releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (rootProject.ext.hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
    implementation project(':file-browser')
    implementation project(':file-ops')
    implementation project(':archive')
    implementation project(':cleanup')
    implementation project(':editor')
    implementation project(':apk-tools')
    implementation project(':security')
    implementation project(':root')
    implementation project(':transfer')

    implementation "androidx.appcompat:appcompat:${rootProject.ext.appcompatVersion}"
    implementation "com.google.android.material:material:${rootProject.ext.materialVersion}"
    implementation "androidx.constraintlayout:constraintlayout:${rootProject.ext.constraintLayoutVersion}"
    implementation "androidx.recyclerview:recyclerview:${rootProject.ext.recyclerviewVersion}"

    // ViewModel + LiveData
    implementation "androidx.lifecycle:lifecycle-viewmodel:${rootProject.ext.lifecycleVersion}"
    implementation "androidx.lifecycle:lifecycle-livedata:${rootProject.ext.lifecycleVersion}"
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"

    // ShizukuProvider：接收 Shizuku 管理器下发的 Binder（应用进程内，无自定义 Service）
    implementation "dev.rikka.shizuku:provider:${rootProject.ext.shizukuVersion}"
}